<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>边测边报 · 质检员</title>
<style>
:root{
  --tx:#f5f5f7; --tx2:#a1a1aa; --tx3:#63636b; --tx4:#2e2e33;
  --line:rgba(255,255,255,.08);
  --lime:#c6f43f; --red:#ff5a4e; --amber:#ffb547; --violet:#aa9cff;
  --sans:-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  --disp:"SF Pro Display",-apple-system,"PingFang SC",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#050506;color:var(--tx);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;display:grid;place-items:center}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(700px 500px at 50% 40%,rgba(198,244,63,.06),transparent 70%);pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.micro{font:500 10.5px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}

.stagewrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.cap{font:500 11px/1 var(--mono);letter-spacing:.2em;color:var(--tx3);text-transform:uppercase}
.device{width:393px;height:852px;border-radius:60px;padding:12px;background:linear-gradient(145deg,#36363c,#141417 40%,#27272c);box-shadow:0 0 0 1px #45454c,0 50px 100px rgba(0,0,0,.7),inset 0 0 2px rgba(255,255,255,.2);transform-origin:center;position:relative}
.scr{position:relative;height:100%;border-radius:48px;background:#000;overflow:hidden;display:flex;flex-direction:column}

/* dynamic island → alert */
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:20;transition:all .5s var(--ease);overflow:hidden;display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 0 0 1px rgba(255,255,255,0)}
.island .ic{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;opacity:0;transition:opacity .3s}
.island .tx{opacity:0;transition:opacity .25s;min-width:0}
.island .tx b{display:block;font-size:14px;font-weight:600;white-space:nowrap}
.island .tx span{display:block;font-size:12.5px;color:var(--tx2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.island.open{width:calc(100% - 20px);height:76px;border-radius:30px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 12px 40px rgba(0,0,0,.6)}
.island.open .ic,.island.open .tx{opacity:1;transition-delay:.18s}
.island.ng .ic{background:var(--red)} .island.warn .ic{background:var(--amber)} .island.ok .ic{background:var(--lime)} .island.fix .ic{background:var(--violet)}
.island.ng .tx b{color:#ff8a80} .island.warn .tx b{color:var(--amber)} .island.ok .tx b{color:var(--lime)} .island.fix .tx b{color:var(--violet)}
.island.rec{width:150px}
.island.rec::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}

.sb{height:54px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0;font:600 16px/1 var(--disp)}
.sb .r{display:flex;align-items:center;gap:7px;font:600 12px/1 var(--sans)}
.sb .net{color:var(--tx)} .sb .net.off{color:var(--amber)}
.hd{padding:10px 24px 0;display:flex;justify-content:space-between;align-items:flex-end}
.hd h1{font:600 22px/1.2 var(--disp);letter-spacing:.02em}
.hd p{font-size:12px;color:var(--tx3);margin-top:3px}
.hd .pg{font:200 30px/1 var(--disp);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hd .pg small{font-size:15px;color:var(--tx3);font-weight:300}
.hd .spk{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;margin-left:14px;color:var(--tx3)}
.hd .spk.on{color:var(--lime);border-color:rgba(198,244,63,.4)}
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:14px 24px 0}
.segs i{height:3px;border-radius:2px;background:var(--tx4);transition:background .4s}
.segs i.ok{background:var(--lime)} .segs i.ng{background:var(--red)} .segs i.warn{background:var(--amber)} .segs i.fix{background:var(--violet)}
.next{padding:22px 24px 0}
.next .micro{display:block;margin-bottom:6px}
.next .micro.ng{color:var(--red)}
.next b{font:500 19px/1.3 var(--sans)}
.next span.std{font:12.5px var(--mono);color:var(--tx3);margin-left:10px}

.hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px;transition:opacity .35s;min-height:0}
.hero.dimmed{opacity:.2}
.hero .it{font-size:16px;color:var(--tx2);display:flex;align-items:center;gap:8px}
.hero .it .ns{font-size:10.5px;color:var(--amber);border:1px solid rgba(255,181,71,.45);border-radius:4px;padding:1px 5px}
.hero .v{font:200 104px/1 var(--disp);letter-spacing:-.05em;margin:8px 0 14px -3px;display:flex;align-items:baseline;font-variant-numeric:tabular-nums;white-space:nowrap}
.hero .v small{font:300 20px/1 var(--disp);color:var(--tx3);letter-spacing:0;margin-left:10px}
.hero.ng .v span{color:var(--red)} .hero.warn .v span{color:var(--amber)}
.verdict{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:8px 15px;border-radius:999px;font-size:14.5px;font-weight:600}
.verdict.ok{background:rgba(198,244,63,.13);color:var(--lime)} .verdict.ng{background:rgba(255,90,78,.15);color:#ff8a80} .verdict.warn{background:rgba(255,181,71,.14);color:var(--amber)} .verdict.dim{background:rgba(255,255,255,.06);color:var(--tx2)}
.hero .std{margin-top:12px;font:12.5px var(--mono);color:var(--tx3)}
.hero .pop{animation:pop .5s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

.rb{margin:0 18px;padding:14px 16px;border-radius:20px;background:#0f0f11;border:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;min-height:72px}
.rb .eq{display:flex;gap:3px;align-items:center;height:20px;margin-top:1px}
.rb .eq i{width:3px;height:5px;border-radius:2px;background:var(--tx4)}
.rb.on .eq i{background:var(--lime);animation:eq .9s ease-in-out infinite}
.rb.on .eq i:nth-child(2){animation-delay:.15s}.rb.on .eq i:nth-child(3){animation-delay:.3s}
@keyframes eq{0%,100%{height:5px}50%{height:18px}}
.rb p{font-size:14.5px;line-height:1.55;color:var(--tx)}
.rb p.idle{color:var(--tx3)}

.dock{flex:none;padding:16px 26px 10px;display:flex;flex-direction:column;align-items:center;gap:14px}
.live{height:44px;width:100%;text-align:center;font-size:15px;color:var(--tx2);line-height:1.45;display:flex;align-items:center;justify-content:center}
.live.idle{color:var(--tx3);font-size:13px}
.live .caret{display:inline-block;width:2px;height:16px;background:var(--lime);margin-left:2px;vertical-align:-2px;animation:blink .8s infinite}
#wave{width:100%;height:30px;display:block}
.ctrls{width:100%;display:flex;align-items:center;justify-content:space-between}
.side{width:52px;height:52px;border-radius:50%;background:#141416;border:1px solid var(--line);display:grid;place-items:center;color:var(--tx2);transition:transform .2s}
.side:active{transform:scale(.94)}
.mic{width:84px;height:84px;border-radius:50%;background:var(--lime);display:grid;place-items:center;position:relative;transition:transform .2s,background .3s}
.mic:active{transform:scale(.95)}
.mic::before,.mic::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:2px solid var(--red);opacity:0}
.mic.on{background:var(--red)}
.mic.on svg{stroke:#fff}
.mic.on::before{animation:ring 1.4s infinite}
.mic.on::after{animation:ring 1.4s .7s infinite}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.6);opacity:0}}
.hint{font:500 10.5px/1 var(--mono);letter-spacing:.14em;color:var(--tx3)}
.home{width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);margin:6px auto 8px}

/* sheets */
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:30}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;background:#121214;border-radius:30px 30px 0 0;border-top:1px solid var(--line);transform:translateY(100%);transition:transform .4s var(--ease);z-index:31;display:flex;flex-direction:column;padding:10px 20px 26px}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 14px}
.sheet h3{font:600 17px/1.3 var(--sans);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.sheet textarea{width:100%;height:92px;background:#1b1b1e;border:1px solid var(--line);border-radius:16px;color:var(--tx);font:16px/1.5 var(--sans);padding:12px 14px;resize:none;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
.chips button{font-size:13px;color:var(--tx2);background:#1b1b1e;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.send{height:50px;border-radius:16px;background:var(--lime);color:#0a0a0b;font-weight:600;font-size:16px}
.recs{overflow:auto;margin:0 -4px}
.rec{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.rec b{font-weight:500;font-size:15px}
.rec .val{font:15px var(--mono);text-align:right}
.rec .raw{font-size:12px;color:var(--tx3)}
.rec .vd{font-size:12px;text-align:right}
.c-ok{color:var(--lime)} .c-ng{color:#ff8a80} .c-warn{color:var(--amber)} .c-dim{color:var(--tx3)} .c-fix{color:var(--violet)}

@media (max-width:520px){
  body{display:block;background:#000}
  .stagewrap{display:block;height:100%}
  .cap{display:none}
  .device{width:100vw;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:#000;transform:none!important}
  .scr{border-radius:0}
  .sb{padding-top:max(6px,env(safe-area-inset-top))}
  .home{display:none}
  .dock{padding-bottom:max(18px,env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="stagewrap">
  <div class="device" id="device">
    <div class="scr">
      <div class="island" id="island"><div class="ic" id="islIc"></div><div class="tx"><b id="islT"></b><span id="islS"></span></div></div>
      <div class="sb"><span id="time">14:20</span><span class="r"><span class="net" id="net">5G</span><svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="1.6" fill="currentColor"/><rect x="23" y="4" width="1.5" height="4" rx=".7" fill="currentColor" opacity=".4"/></svg></span></div>
      <div class="hd">
        <div><h1>出厂检验</h1><p>WH-26-0815 · QD 32/5t × 22.5m</p></div>
        <div style="display:flex;align-items:center"><span class="pg" id="pg">0<small>/13</small></span><button class="spk" id="spk" title="语音播报"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button></div>
      </div>
      <div class="segs" id="segs"></div>
      <div class="next" id="next"></div>
      <div class="hero dimmed" id="hero"></div>
      <div class="rb" id="rb"><div class="eq"><i></i><i></i><i></i></div><p class="idle" id="rbp">系统会复述每一个数，听错了直接说「更正」。</p></div>
      <div class="dock">
        <div class="live idle" id="live">报「检验项 + 位置 + 数值」</div>
        <canvas id="wave" width="680" height="60"></canvas>
        <div class="ctrls">
          <button class="side" id="kb" title="文字输入"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M18 13h.01M9 15h6"/></svg></button>
          <button class="mic" id="mic" title="轻点：演示下一句"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0a0a0b" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
          <button class="side" id="ls" title="本次记录"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
        </div>
        <span class="hint" id="hint">TAP · 演示下一句</span>
      </div>
      <div class="home"></div>

      <div class="sheet-bg" id="bg"></div>
      <div class="sheet" id="shKb"><div class="grab"></div><h3>说一句 <span class="micro">模拟语音识别结果</span></h3>
        <textarea id="ta" placeholder="例：旁弯右边九"></textarea>
        <div class="chips"><button>旁弯右边九</button><button>跨度左边二十二点五米</button><button>上拱度三十</button><button>轨距两千五百，说错了，两千四百九十七</button><button>检验完毕</button></div>
        <button class="send" id="send">送入识别</button></div>
      <div class="sheet" id="shLs"><div class="grab"></div><h3>本次记录 <span class="micro" id="recN"></span></h3><div class="recs" id="recs"></div></div>
    </div>
  </div>
  <div class="cap">Inspector · 质检员手机端</div>
</div>

<script src="engine.js"></script>
<script>
"use strict";
const {ITEMS, IT, MEASURABLE, SCRIPT, ST, label, fmt, esc, counts} = QCE;
const $ = id => document.getElementById(id);
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const P = {busy:false, queue:[], speaking:false, tts:load('qcp_tts',false), gen:0, islT:null};
const spdOf = cmd => cmd.spd || load('qcs_speed',1);
const sleep = (ms,spd) => document.hidden ? Promise.resolve() : new Promise(r=>setTimeout(r, ms/(spd||1)));
const clsOf = s => (ST[s]||ST.pending)[1];

function fit(){ const d=$('device'); if(innerWidth<=520){ d.style.transform=''; return; } const s=Math.min(1,(innerHeight-70)/852,(innerWidth-40)/393); d.style.transform=`scale(${s})`; d.parentElement.style.margin=`${-(852*(1-s))/2}px 0`; }
addEventListener('resize',fit); fit();

function speak(t){ if(!P.tts||!('speechSynthesis' in window)) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t.replace(/μm/g,'微米')); u.lang='zh-CN'; u.rate=1.08; speechSynthesis.speak(u);}catch(e){} }
function island(state, title, sub, ms){
  const el=$('island'); clearTimeout(P.islT);
  if(!state){ el.className='island'; return; }
  if(state==='rec'){ el.className='island rec'; return; }
  el.className='island open '+state; $('islT').textContent=title; $('islS').textContent=sub||'';
  $('islIc').innerHTML = state==='ok'?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0a0a0b" stroke-width="3" stroke-linecap="round"><path d="M5 12l5 5L20 7"/></svg>':'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0a0a0b" stroke-width="3" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/></svg>';
  if(ms) P.islT=setTimeout(()=>island(null), ms);
}

function renderMeta(){
  const S=QCE.S, c=counts();
  $('pg').innerHTML=`${c.done}<small>/${c.m}</small>`;
  $('segs').innerHTML = MEASURABLE.map(it=>{ const r=S.items[it.id]; return `<i class="${r.status==='pending'?'':clsOf(r.status)}"></i>`; }).join('');
  const re = ITEMS.find(x=>S.items[x.id].status==='retest');
  const nx = MEASURABLE.find(x=>S.items[x.id].status==='pending');
  if(re) $('next').innerHTML=`<span class="micro ng">Retest · 待复测</span><b>${esc(re.kind==='derived'?(re.id==='dD'?'对角线（一 / 二）':'跨度（左 / 右）'):label(re))}</b>`;
  else if(nx) $('next').innerHTML=`<span class="micro">Next · 下一项</span><b>${esc(label(nx))}</b><span class="std">${esc(nx.std)} ${nx.unit}</span>`;
  else $('next').innerHTML=`<span class="micro">Done · 全部录入</span><b class="c-ok">检验项已全部录入</b>`;
  const n=$('net'); n.className='net'+(S.net?'':' off'); n.textContent=S.net?'5G':`离线 · ${S.offline.length}`;
  $('time').textContent=QCE.hhmm(S.clock).slice(0,5);
  $('spk').classList.toggle('on',P.tts);
  $('hint').textContent = S.cursor<SCRIPT.length ? `TAP · 演示下一句 ${S.cursor+1}/${SCRIPT.length}` : '演示结束 · 可用键盘自由输入';
  renderRecs();
}
function heroHTML(o){
  return `<div class="pop"><div class="it">${esc(o.title)}${o.nonstd?'<span class="ns">协议非标</span>':''}</div><div class="v"><span>${esc(o.big)}</span>${o.unit?`<small>${o.unit}</small>`:''}</div><span class="verdict ${o.cls||'dim'}">${esc(o.verdict)}</span>${o.std?`<div class="std">${esc(o.std)}</div>`:''}</div>`;
}
function setHero(o){ const h=$('hero'); h.className='hero '+(o.cls||'dim'); h.innerHTML=heroHTML(o); }
function stdOf(ev){ const it=ev.itemId&&IT[ev.itemId]; return it?`标准 ${it.std} ${it.unit}`:''; }
function idle(){
  setHero({title:'准备开始', big:'—', verdict:'待检', cls:'dim'}); $('hero').classList.add('dimmed');
  $('rbp').className='idle'; $('rbp').textContent='系统会复述每一个数，听错了直接说「更正」。';
  $('live').className='live idle'; $('live').textContent='报「检验项 + 位置 + 数值」'; island(null); renderMeta();
}
function showLast(){ const e=QCE.S.events[0]; if(!e) return idle(); setHero({...e.out, std:stdOf(e)}); $('rbp').className=''; $('rbp').textContent=e.out.readback; $('live').className='live'; $('live').textContent=e.raw; renderMeta(); }
function renderRecs(){
  const evs=QCE.S.events; $('recN').textContent=evs.length+' 条';
  $('recs').innerHTML = evs.map(e=>`<div class="rec"><b>${esc(e.itemId?label(IT[e.itemId]):(e.A.cmd?'检验完毕':'未入表'))}</b><span class="val c-${e.out.cls}">${e.A.value!=null&&e.itemId?fmt(e.A.value):'—'}${e.synced?'':' ⇡'}</span><span class="raw">「${esc(e.raw)}」 ${e.t}</span><span class="vd c-${e.out.cls}">${esc(e.out.verdict)}</span></div>`).join('') || '<p class="c-dim" style="font-size:13px;padding:10px 4px">还没有记录</p>';
}

async function present(res, cmd){
  const spd=spdOf(cmd), gen=P.gen;
  if(res.kind==='reset'){ idle(); return; }
  if(res.kind==='utt'){
    const {ev, A, out}=res;
    if(res.toast){ island('fix','主管已复核', res.toast.html.replace(/<[^>]+>/g,''), 0); await sleep(600,spd); }
    island('rec'); $('mic').classList.add('on'); P.speaking=true;
    $('hero').classList.add('dimmed'); $('rb').className='rb'; $('rbp').className='idle'; $('rbp').textContent='正在听…';
    const live=$('live'); live.className='live'; const ch=[...ev.raw], T=Math.min(ev.dur,2.4)*900;
    for(let i=1;i<=ch.length;i++){ if(gen!==P.gen) return; live.innerHTML=esc(ch.slice(0,i).join(''))+'<span class="caret"></span>'; await sleep(T/ch.length,spd); }
    P.speaking=false; $('mic').classList.remove('on'); island(null);
    let shown = esc(ev.raw); for(const c of A.corr){ if(c.layer!=='human') shown = shown.replace(esc(c.from), `<span class="c-fix">${esc(c.to)}</span>`); }
    live.innerHTML = shown;
    await sleep(1300,spd); if(gen!==P.gen) return;
    setHero({...out, std:stdOf(ev)}); renderMeta();
    if(out.alert) island(out.alert.cls, out.alert.title, out.alert.text, 0);
    await sleep(500,spd); if(gen!==P.gen) return;
    $('rb').className='rb on'; $('rbp').className=''; $('rbp').textContent=out.readback; speak(out.readback);
    await sleep(Math.max(1100,out.readback.length*48),spd);
    $('rb').className='rb';
    if(!out.alert) island(null);
    return;
  }
  renderMeta();
  if(res.kind==='net'){ island(res.on?'ok':'warn', res.on?'网络已恢复':'已切到离线模式', res.on?(res.n?`${res.n} 条离线记录已同步`:''):'录音和规则判定在手机本地进行', 2600); }
  else if(res.kind==='dispose'){ const it=IT[res.item]; if(res.how==='retest') island('warn','主管要求复测', label(it), 4000); else island('fix', res.how==='rectify'?'已转整改':'让步接收', `${label(it)}${res.tk?' · '+res.tk.no+' → '+res.tk.team:''}`, 2600); }
  else if(res.kind==='report'){ island(res.ok?'ok':'ng', res.ok?'检验记录已生成':'暂不允许出报告', res.ok?'每条数据附原始语音证据号':'还有不合格项未处置', 2800); }
  if(cmd.step!=null) await sleep(900,spd);
}

QCE.bus.subs.push(cmd=>{ if(cmd.t==='reset'){ P.queue=[]; P.gen++; P.speaking=false; $('mic').classList.remove('on'); } P.queue.push(cmd); pump(); });
async function pump(){ if(P.busy) return; P.busy=true; while(P.queue.length){ const cmd=P.queue.shift(); const res=QCE.exec(cmd); try{ await present(res,cmd); }catch(e){ console.error(e); } } P.busy=false; renderMeta(); }
QCE.bus.onSync = ()=>showLast();

/* waveform */
function waveLoop(t){
  const cv=$('wave'), g=cv.getContext('2d'), W=cv.width, H=cv.height, n=54, w=W/n;
  g.clearRect(0,0,W,H);
  for(let i=0;i<n;i++){
    const env=Math.sin(Math.PI*(i+.5)/n);
    const a = P.speaking ? (0.2+0.8*Math.abs(Math.sin(t/105+i*.6)*Math.sin(t/280+i*.2)))*env : 0.05;
    const h=Math.max(3,a*H);
    g.fillStyle = P.speaking ? `rgba(255,90,78,${.4+.6*env})` : 'rgba(255,255,255,.14)';
    g.beginPath(); (g.roundRect?g.roundRect(i*w+w*.28,(H-h)/2,w*.44,h,3):g.rect(i*w+w*.28,(H-h)/2,w*.44,h)); g.fill();
  }
  requestAnimationFrame(waveLoop);
}

/* controls */
function sheet(id){ ['shKb','shLs'].forEach(x=>$(x).classList.toggle('on', x===id)); $('bg').classList.toggle('on', !!id); }
$('mic').onclick=()=>{ const i=QCE.S.cursor; if(P.busy||P.queue.length) return; if(i<SCRIPT.length) QCE.send({...SCRIPT[i], step:i, spd:load('qcs_speed',1)}); else sheet('shKb'); };
$('kb').onclick=()=>{ sheet('shKb'); setTimeout(()=>$('ta').focus(),300); };
$('ls').onclick=()=>{ renderRecs(); sheet('shLs'); };
$('bg').onclick=()=>sheet(null);
$('spk').onclick=()=>{ P.tts=!P.tts; store('qcp_tts',P.tts); renderMeta(); };
document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{ $('ta').value=b.textContent; });
$('send').onclick=()=>{ const t=$('ta').value.trim(); if(!t) return; sheet(null); $('ta').value=''; QCE.send({t:'utt', text:t, gap:60, spd:1}); };
$('ta').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); $('send').click(); } });
document.addEventListener('keydown',e=>{ if(e.target.tagName==='TEXTAREA') return; if(e.code==='Space'||e.key==='ArrowRight'){ e.preventDefault(); $('mic').click(); } });

idle(); requestAnimationFrame(waveLoop);
QCE.hello('phone');
</script>
